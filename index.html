<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Interactive map of Indonesia's 38 provinces with population and national share from the 2020 Population Census (BPS).">
<title>Indonesia Population Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Base reset */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: masthead + language switch + national total, then the map with a detail panel beside it (stacked on phones), then a ranked list of all 38 provinces. */
:root{
  --bg:#f4f6f8; --surface:#ffffff; --sea:#e6eef5; --ink:#13202c; --muted:#566573; --faint:#8a97a4; --line:#dbe2e9;
  --accent:#c8102e; --accent-soft:#c8102e1a; --land-stroke:#ffffff;
  --c1:#cde2fb; --c2:#9ec5f4; --c3:#6da7ec; --c4:#3987e5; --c5:#256abf; --c6:#0d366b;
  --font:"Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
}
:root:lang(ja){ --font:"Plus Jakarta Sans", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", "Noto Sans CJK JP", "Meiryo", system-ui, sans-serif }
:root:lang(zh){ --font:"Plus Jakarta Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", "Noto Sans CJK SC", system-ui, sans-serif }
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141a; --surface:#151d25; --sea:#111a22; --ink:#e4ebf1; --muted:#9aa8b5; --faint:#6c7a87; --line:#25313c;
  --accent:#ff5c70; --accent-soft:#ff5c7024; --land-stroke:#3b4a58;
  --c1:#cde2fb; --c2:#9ec5f4; --c3:#6da7ec; --c4:#3987e5; --c5:#1c5cab; --c6:#0d366b; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e141a; --surface:#151d25; --sea:#111a22; --ink:#e4ebf1; --muted:#9aa8b5; --faint:#6c7a87; --line:#25313c;
  --accent:#ff5c70; --accent-soft:#ff5c7024; --land-stroke:#3b4a58;
  --c1:#cde2fb; --c2:#9ec5f4; --c3:#6da7ec; --c4:#3987e5; --c5:#1c5cab; --c6:#0d366b; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:24px 40px}
button,input{font-family:inherit}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.num{font-variant-numeric:tabular-nums}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 32px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.flag{display:inline-block;width:18px;height:12px;border-radius:2px;background:linear-gradient(var(--accent) 50%, #ffffff 50%);box-shadow:0 0 0 1px var(--line);flex:none}
h1{font-weight:800;font-size:clamp(30px,5vw,48px);line-height:1.08;margin:6px 0 0;letter-spacing:-.025em;text-wrap:balance}
:root:lang(ja) h1, :root:lang(zh) h1{letter-spacing:0}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:14px}
.langs{display:inline-flex;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--surface);gap:2px}
.langs button{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:13px;padding:6px 11px;border-radius:7px;cursor:pointer;white-space:nowrap}
.langs button:hover{color:var(--ink)}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.total{text-align:right}
.total .label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.total .big{font-weight:700;font-size:clamp(26px,4vw,36px);line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.total .sub{font-size:13px;color:var(--muted)}
@media (max-width:1000px){.right{align-items:flex-start;width:100%}.total{text-align:left}}

.stage{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:stretch}
@media (max-width:900px){.stage{grid-template-columns:minmax(0,1fr)}}

.mapcard{background:var(--sea);border:1px solid var(--line);border-radius:14px;position:relative;overflow:hidden;min-width:0;display:flex;flex-direction:column}
.mapbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px 0}
.hint{font-size:13px;color:var(--muted);min-width:0}
.zoom{display:flex;gap:6px}
.zoom button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:17px;line-height:1;cursor:pointer;display:grid;place-items:center}
.zoom button:hover{border-color:var(--muted)}
.zoom button:focus-visible,.prov:focus-visible,.row:focus-visible,.chip:focus-visible,.langs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg#map{display:block;width:100%;height:auto;aspect-ratio:960/372;touch-action:none;cursor:grab;max-width:100%;margin-block:auto}
svg#map.dragging{cursor:grabbing}
.prov{stroke:var(--land-stroke);stroke-width:.8;vector-effect:non-scaling-stroke;stroke-linejoin:round;cursor:pointer;transition:filter .15s}
.prov:hover{filter:brightness(1.08) saturate(1.1)}
.prov.sel{stroke:var(--accent);stroke-width:2.5}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:0 14px 12px;font-size:12px;color:var(--muted)}
.legend .title{font-weight:600;color:var(--ink)}
.legend .k{display:flex;align-items:center;gap:6px}
.legend .sw{width:14px;height:14px;border-radius:3px;box-shadow:inset 0 0 0 1px #00000014}

.tip{position:absolute;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;box-shadow:0 6px 20px #0000001f;white-space:nowrap;z-index:5}
.tip b{display:block;font-weight:600}
.tip span{color:var(--muted)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.panel .region{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.panel h2{font-weight:800;font-size:28px;line-height:1.15;margin:4px 0 0;letter-spacing:-.015em;text-wrap:balance}
.panel .alt{font-size:13px;color:var(--muted);margin-top:4px}
.stat .label{font-size:12px;color:var(--muted);font-weight:500}
.stat .val{font-weight:700;font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat .val small{font-size:16px;color:var(--muted);font-weight:600;margin-left:2px}
.strip{height:12px;border-radius:6px;background:var(--line);position:relative;overflow:hidden}
.strip i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:6px;min-width:3px}
.strip-cap{font-size:12px;color:var(--muted);margin-top:6px}
.note{font-size:13px;color:var(--muted);background:var(--accent-soft);border-radius:8px;padding:10px 12px}
.facts{display:grid;gap:8px;font-size:13px;border-top:1px solid var(--line);padding-top:14px;margin:0}
.facts div{display:flex;justify-content:space-between;gap:12px}
.facts dt{color:var(--muted)} .facts dd{margin:0;font-weight:600;text-align:right}

section.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 18px 8px;min-width:0}
.listhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.listhead h3{font-weight:700;font-size:20px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:5px 11px;font-weight:500;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{opacity:.65;margin-left:5px;font-size:12px;font-variant-numeric:tabular-nums}
.rows{columns:360px;column-gap:28px}
@media (max-width:420px){.rows{columns:1}}
.row{break-inside:avoid;display:grid;grid-template-columns:28px minmax(0,1fr) 84px 62px;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;color:inherit;font:inherit;text-align:left;width:100%;border-radius:0}
.row:hover{background:var(--accent-soft)}
.row.sel{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.row .rk{font-size:12px;color:var(--faint);text-align:right;font-variant-numeric:tabular-nums}
.row .nm{min-width:0;display:flex;flex-direction:column;gap:4px}
.row .nm span{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.row .bar i{display:block;height:100%;border-radius:2px}
.row .pp{text-align:right;font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted)}
.row .pc{font-size:13px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:420px){.row .pp{display:none}.row{grid-template-columns:24px minmax(0,1fr) 62px}}

footer{font-size:12.5px;color:var(--muted);max-width:80ch;display:flex;flex-direction:column;gap:8px}
footer h4{margin:0;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
footer ol{margin:0;padding-left:1.6em;display:flex;flex-direction:column;gap:6px}
footer li{padding-left:.2em}
footer li::marker{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
footer strong{color:var(--ink)}
footer a{color:inherit}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow"><span class="flag" aria-hidden="true"></span><span data-t="eyebrow"></span></div>
      <h1 data-t="title"></h1>
    </div>
    <div class="right">
      <div class="langs" id="langs" role="group" aria-label="Language">
        <button type="button" id="lang-en" data-lang="en" lang="en">English</button>
        <button type="button" id="lang-id" data-lang="id" lang="id">Indonesia</button>
        <button type="button" id="lang-zh" data-lang="zh" lang="zh">中文</button>
        <button type="button" id="lang-ja" data-lang="ja" lang="ja">日本語</button>
      </div>
      <div class="total">
        <div class="label" data-t="totalLabel"></div>
        <div class="big" id="bigTotal"></div>
        <div class="sub" data-t="totalSub"></div>
      </div>
    </div>
  </header>

  <div class="stage">
    <div class="mapcard">
      <div class="mapbar">
        <div class="hint" data-t="hint"></div>
        <div class="zoom">
          <button id="zin" type="button">+</button>
          <button id="zout" type="button">−</button>
          <button id="zreset" type="button">⟲</button>
        </div>
      </div>
      <svg id="map" viewBox="0 0 960 372" role="group">
        <g transform="translate(15 6)"><g id="vp"></g></g>
      </svg>
      <div class="legend" id="legend"></div>
      <div class="tip" id="tip" hidden></div>
    </div>

    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>

  <section class="list">
    <div class="listhead">
      <h3 data-t="listTitle"></h3>
      <div class="chips" id="chips"></div>
    </div>
    <div class="rows" id="rows"></div>
  </section>

  <footer>
    <h4 data-t="remarks"></h4>
    <ol>
      <li data-t="foot1"></li>
      <li data-t="foot2"></li>
      <li data-t="foot3"></li>
    </ol>
  </footer>
</div>

  "81":["Maluku","Maluku","马鲁古省","マルク州"],
  "82":["North Maluku","Maluku Utara","北马鲁古省","北マルク州"],
  "91-A":["Papua","Papua","巴布亚省","パプア州"],
  "91-B":["Highland Papua","Papua Pegunungan","山地巴布亚省","パプア山岳州"],

  "92-A":["West Papua","Papua Barat","西巴布亚省","西パプア州"],

const REGIONS = {

  "Sulawesi":["Sulawesi","Sulawesi","苏拉威西","スラウェシ"],
  "Maluku":["Maluku","Maluku","马鲁古","マルク"],
  "Papua":["Papua","Papua","巴布亚","パプア"]
};
const LANGS = ['en','id','zh','ja'];
const LOCALE = {en:'en-US', id:'id-ID', zh:'zh-CN', ja:'ja-JP'};
const T = {
  en:{

    zin:'Zoom in', zout:'Zoom out', zreset:'Reset view', map:"Map of Indonesia's 38 provinces shaded by population",
    legend:'People', bins:['< 1M','1–2.5M','2.5–5M','5–10M','10–20M','20M +'],
    popLabel:'Population', shareLabel:"Share of Indonesia's population",
    oneIn:n=>`About 1 in ${n} Indonesians lives here`,
    split:p=>`Counted in 2020 as part of ${p} province. This figure regroups its regencies under the 2022 boundaries.`,
    rank:'Rank by population', rankVal:r=>`#${r} of 38`, regShare:r=>`Share of ${r}`, regTotal:r=>`${r} total`,
    listTitle:'All provinces, ranked', all:'All', remarks:'Remarks',
    aria:(n,p,s)=>`${n}: ${p} people, ${s}% of Indonesia`, langGroup:'Language',
    foot1:`<strong>Source:</strong> Population: Badan Pusat Statistik, ${a(L_SP,'Hasil Sensus Penduduk 2020')} (September 2020), the latest population census. Percentages are each province's share of the 270,203,917 total.`,
    foot2:`<strong>Papua region:</strong> The 2020 census counted two provinces, Papua and West Papua, before they were split into six in 2022. Figures for those six come from the census regency totals (${a(L_PA,'Papua')}, ${a(L_PB,'West Papua')}) regrouped under the 2022 boundaries.`,

  id:{
    eyebrow:'Sensus Penduduk 2020 · BPS', title:'Peta Penduduk Indonesia', totalLabel:'Jumlah penduduk',

    hint:'Ketuk provinsi untuk melihat jumlah penduduknya. Cubit, gulir, atau tekan + untuk memperbesar.',

    legend:'Jiwa', bins:['< 1 jt','1–2,5 jt','2,5–5 jt','5–10 jt','10–20 jt','20 jt +'],
    popLabel:'Jumlah penduduk', shareLabel:'Persentase dari penduduk Indonesia',
    oneIn:n=>`Sekitar 1 dari ${n} penduduk Indonesia tinggal di sini`,
    split:p=>`Pada 2020 masih tercatat sebagai bagian Provinsi ${p}. Angka ini mengelompokkan ulang kabupaten/kotanya sesuai batas wilayah 2022.`,
    rank:'Peringkat jumlah penduduk', rankVal:r=>`#${r} dari 38`, regShare:r=>`Porsi di ${r}`, regTotal:r=>`Total ${r}`,
    listTitle:'Semua provinsi, menurut peringkat', all:'Semua', remarks:'Catatan',
    aria:(n,p,s)=>`${n}: ${p} jiwa, ${s}% dari penduduk Indonesia`, langGroup:'Bahasa',
    foot1:`<strong>Sumber:</strong> Jumlah penduduk: Badan Pusat Statistik, ${a(L_SP,'Hasil Sensus Penduduk 2020')} (September 2020), sensus penduduk terbaru. Persentase adalah porsi tiap provinsi dari total 270.203.917 jiwa.`,
    foot2:`<strong>Wilayah Papua:</strong> Sensus 2020 masih mencatat dua provinsi, Papua dan Papua Barat, sebelum dimekarkan menjadi enam pada 2022. Angka keenam provinsi tersebut berasal dari jumlah penduduk kabupaten/kota hasil sensus (${a(L_PA,'Papua')}, ${a(L_PB,'Papua Barat')}) yang dikelompokkan ulang sesuai batas 2022.`,
    foot3:`<strong>Batas wilayah:</strong> ${a(L_GEO,'Indonesia GeoJSON &amp; TopoJSON Maps (38 Provinces)')}, CC BY 4.0; diproyeksikan ulang dan dibulatkan untuk halaman ini. Bentuk wilayah disederhanakan, sehingga pulau kecil mungkin tidak tampak.`
  },
  zh:{
    eyebrow:'2020年人口普查 · BPS', title:'印度尼西亚人口地图', totalLabel:'普查总人口',
    totalSub:'2020年9月 · 38个省级行政区',
    hint:'点击省份查看人口。可双指缩放、滚动或点击 + 放大。',
    zin:'放大', zout:'缩小', zreset:'重置视图', map:'按人口着色的印度尼西亚38个省级行政区地图',
    legend:'人口', bins:['< 100万','100–250万','250–500万','500–1000万','1000–2000万','2000万 +'],
    popLabel:'人口', shareLabel:'占全国人口比例',
    oneIn:n=>`约每 ${n} 名印尼人中就有 1 人居住于此`,

    rank:'人口排名', rankVal:r=>`第 ${r} 名（共 38 个）`, regShare:r=>`占${r}比例`, regTotal:r=>`${r}总人口`,
    listTitle:'各省人口排名', all:'全部', remarks:'备注',
    aria:(n,p,s)=>`${n}：${p} 人，占全国 ${s}%`, langGroup:'语言',
    foot1:`<strong>来源：</strong>人口数据来自印尼中央统计局（BPS）${a(L_SP,'《2020年人口普查结果》')}（2020年9月），为最新一次人口普查。百分比为各省人口占全国总人口 270,203,917 人的比例。`,
    foot2:`<strong>巴布亚地区：</strong>2020年普查时只有巴布亚省和西巴布亚省两个省，2022年分设为六个省。这六个省的数据由普查的县/市人口（${a(L_PA,'巴布亚')}、${a(L_PB,'西巴布亚')}）按2022年新边界重新汇总而得。`,
    foot3:`<strong>行政边界：</strong>${a(L_GEO,'Indonesia GeoJSON &amp; TopoJSON Maps (38 Provinces)')}（CC BY 4.0），本页已重新投影并取整。图形经过简化，部分小岛可能未显示。`
  },
  ja:{
    eyebrow:'2020年人口センサス · BPS', title:'インドネシア人口マップ', totalLabel:'総人口',
    totalSub:'2020年9月 · 38州',
    hint:'州をタップすると人口を表示します。ピンチ、スクロール、または + で拡大できます。',
    zin:'拡大', zout:'縮小', zreset:'表示をリセット', map:'人口で色分けしたインドネシア38州の地図',
    legend:'人口', bins:['< 100万','100–250万','250–500万','500–1000万','1000–2000万','2000万 +'],
    popLabel:'人口', shareLabel:'全国人口に占める割合',
    oneIn:n=>`インドネシア人の約 ${n} 人に 1 人がここに住んでいます`,
    split:p=>`2020年のセンサスでは${p}の一部として集計。この数値は県・市の人口を2022年の州境で再集計したものです。`,
    rank:'人口順位', rankVal:r=>`38州中 第${r}位`, regShare:r=>`${r}内の割合`, regTotal:r=>`${r}の合計`,
    listTitle:'全州ランキング', all:'すべて', remarks:'備考',
    aria:(n,p,s)=>`${n}：${p}人、全国の${s}%`, langGroup:'言語',
    foot1:`<strong>出典：</strong>人口はインドネシア中央統計庁（BPS）${a(L_SP,'「2020年人口センサス結果」')}（2020年9月）による。最新の人口センサスです。割合は全国総人口 270,203,917 人に占める各州の比率です。`,
    foot2:`<strong>パプア地域：</strong>2020年のセンサス時点ではパプア州と西パプア州の2州のみで、2022年に6州へ分割されました。この6州の数値は、センサスの県・市別人口（${a(L_PA,'パプア')}、${a(L_PB,'西パプア')}）を2022年の新しい州境で再集計したものです。`,
    foot3:`<strong>境界データ：</strong>${a(L_GEO,'Indonesia GeoJSON &amp; TopoJSON Maps (38 Provinces)')}（CC BY 4.0）。本ページ用に再投影・丸め処理を行いました。形状は簡略化しているため、小さな島は表示されない場合があります。`
  }
};
const PARENT = {"Papua":"91-A","Papua Barat":"92-A"};

let lang = 'en';
try { const s = localStorage.getItem('idmap-lang'); if (LANGS.includes(s)) lang = s; } catch(_) {}
const L = () => T[lang];
const li = () => LANGS.indexOf(lang);
const nm = id => NAMES[id][li()];
const rg = r => REGIONS[r][li()];
const fmt = n => n.toLocaleString(LOCALE[lang]);
const fp = (n, d=2) => n.toLocaleString(LOCALE[lang], {minimumFractionDigits:d, maximumFractionDigits:d});

const BINS = [1e6, 2.5e6, 5e6, 1e7, 2e7, Infinity];
const binOf = p => BINS.findIndex(b => p < b);
const colorOf = p => `var(--c${binOf(p)+1})`;
DATA.forEach((d,i) => { d.rank = i + 1; d.share = d.pop / TOTAL * 100; });
const byId = Object.fromEntries(DATA.map(d => [d.id, d]));
const REGION_TOTAL = {};
DATA.forEach(d => REGION_TOTAL[d.region] = (REGION_TOTAL[d.region]||0) + d.pop);

const svg = document.getElementById('map'), vp = document.getElementById('vp');
const tip = document.getElementById('tip'), panel = document.getElementById('panel');
const NS = 'http://www.w3.org/2000/svg';
const paths = {};
DATA.slice().reverse().forEach(d => {
  const p = document.createElementNS(NS, 'path');
  p.setAttribute('d', d.d);
  p.setAttribute('class', 'prov');
  p.setAttribute('fill', colorOf(d.pop));
  p.setAttribute('tabindex', '0');
  p.setAttribute('role', 'button');
  p.dataset.id = d.id;
  vp.appendChild(p); paths[d.id] = p;
});

let selected = null;
function oneInN(share){ const n = 100/share; return n < 10 ? fp(n, 1).replace(/[.,]0$/,'') : String(Math.round(n)); }
function renderPanel(d){
  const t = L();
  const regionShare = d.pop / REGION_TOTAL[d.region] * 100;
  const alt = lang === 'id' ? '' : `<div class="alt" lang="id">${NAMES[d.id][1]}</div>`;
  panel.innerHTML = `
    <div>
      <div class="region">${rg(d.region)}</div>
      <h2>${nm(d.id)}</h2>${alt}
    </div>
    <div class="stat">
      <div class="label">${t.popLabel}</div>
      <div class="val">${fmt(d.pop)}</div>
    </div>
    <div class="stat">
      <div class="label">${t.shareLabel}</div>
      <div class="val">${fp(d.share)}<small>%</small></div>
      <div class="strip" style="margin-top:8px" aria-hidden="true"><i style="width:${d.share}%"></i></div>
      <div class="strip-cap">${t.oneIn(oneInN(d.share))}</div>
    </div>
    ${d.split ? `<div class="note">${t.split(nm(PARENT[d.split]))}</div>` : ''}
    <dl class="facts">
      <div><dt>${t.rank}</dt><dd>${t.rankVal(d.rank)}</dd></div>
      <div><dt>${t.regShare(rg(d.region))}</dt><dd class="num">${fp(regionShare,1)}%</dd></div>
      <div><dt>${t.regTotal(rg(d.region))}</dt><dd class="num">${fmt(REGION_TOTAL[d.region])}</dd></div>
    </dl>`;
}
function select(id, opts={}){
  const d = byId[id]; if(!d) return;
  if(selected && paths[selected]) paths[selected].classList.remove('sel');
  selected = id;
  const p = paths[id]; p.classList.add('sel'); vp.appendChild(p);
  renderPanel(d);
  document.querySelectorAll('.row').forEach(r => r.classList.toggle('sel', r.dataset.id === id));
  if(opts.focusMap) focusOn(p);
  if(opts.scrollPanel && window.matchMedia('(max-width:900px)').matches) panel.scrollIntoView({behavior:'smooth', block:'nearest'});
}

// chips + ranked list
let region = 'All';
const regionKeys = ['All', ...Object.keys(REGIONS)];
const chips = document.getElementById('chips'), rows = document.getElementById('rows');
const maxShare = DATA[0].share;
function renderChips(){
  chips.innerHTML = '';
  regionKeys.forEach(r => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'chip';
    const n = r === 'All' ? 38 : DATA.filter(d => d.region === r).length;
    b.innerHTML = `${r === 'All' ? L().all : rg(r)}<span class="n">${n}</span>`;
    b.setAttribute('aria-pressed', r === region);
    b.onclick = () => { region = r; renderChips(); renderRows(); };
    chips.appendChild(b);
  });
}
function renderRows(){
  rows.innerHTML = '';
  DATA.filter(d => region === 'All' || d.region === region).forEach(d => {
    const r = document.createElement('button'); r.type = 'button'; r.className = 'row' + (d.id === selected ? ' sel' : '');
    r.dataset.id = d.id;
    r.innerHTML = `<span class="rk">${d.rank}</span>
      <span class="nm"><span>${nm(d.id)}</span><span class="bar"><i style="width:${d.share/maxShare*100}%;background:${colorOf(d.pop)}"></i></span></span>
      <span class="pp">${fmt(d.pop)}</span>
      <span class="pc">${fp(d.share)}%</span>`;
    r.onclick = () => select(d.id, {focusMap:true});
    rows.appendChild(r);
  });
}

function renderLegend(){
  const legend = document.getElementById('legend');
  legend.innerHTML = `<span class="title">${L().legend}</span>`;
  L().bins.forEach((label,i) => {
    const n = DATA.filter(d => binOf(d.pop) === i).length;
    const k = document.createElement('span'); k.className = 'k';
    k.innerHTML = `<span class="sw" style="background:var(--c${i+1})"></span>${label} <span class="num" style="color:var(--faint)">(${n})</span>`;
    legend.appendChild(k);
  });
}

function setLang(next){
  lang = next;
  try { localStorage.setItem('idmap-lang', lang); } catch(_) {}
  const t = L();
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
  document.querySelectorAll('[data-t]').forEach(el => { el.innerHTML = t[el.dataset.t]; });
  document.getElementById('bigTotal').textContent = fmt(TOTAL);
  document.getElementById('langs').setAttribute('aria-label', t.langGroup);
  document.querySelectorAll('#langs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  ['zin','zout','zreset'].forEach(id => { const b = document.getElementById(id); b.setAttribute('aria-label', t[id]); b.title = t[id]; });
  svg.setAttribute('aria-label', t.map);
  DATA.forEach(d => paths[d.id].setAttribute('aria-label', t.aria(nm(d.id), fmt(d.pop), fp(d.share))));
  tip.hidden = true;
  renderLegend(); renderChips(); renderRows();
  if (selected) renderPanel(byId[selected]);
}
document.querySelectorAll('#langs button').forEach(b => b.onclick = () => setLang(b.dataset.lang));

// zoom & pan
const W = 930, H = 360;
let s = 1, tx = 0, ty = 0;
function clamp(){
  s = Math.min(Math.max(s, 1), 14);
  tx = Math.min(0, Math.max(W - W*s, tx));
  ty = Math.min(0, Math.max(H - H*s, ty));
}
function apply(){ clamp(); vp.setAttribute('transform', `translate(${tx.toFixed(2)} ${ty.toFixed(2)}) scale(${s.toFixed(4)})`); }
function zoomAt(f, cx, cy){ const ns = Math.min(Math.max(s*f,1),14); f = ns/s; tx = cx - (cx - tx)*f; ty = cy - (cy - ty)*f; s = ns; apply(); }
function toSvg(e){ const r = svg.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * 960 - 15, (e.clientY - r.top) / r.height * 372 - 6]; }
function focusOn(p){
  const b = p.getBBox();
  const target = Math.min(14, Math.max(1, Math.min(W/(b.width*3.2), H/(b.height*3.2))));
  s = Math.max(s, target);
  tx = W/2 - (b.x + b.width/2)*s; ty = H/2 - (b.y + b.height/2)*s; apply();
}
document.getElementById('zin').onclick = () => zoomAt(1.6, W/2, H/2);
document.getElementById('zout').onclick = () => zoomAt(1/1.6, W/2, H/2);
document.getElementById('zreset').onclick = () => { s = 1; tx = 0; ty = 0; apply(); };
svg.addEventListener('wheel', e => { e.preventDefault(); const [x,y] = toSvg(e); zoomAt(e.deltaY < 0 ? 1.18 : 1/1.18, x, y); }, {passive:false});

const pts = new Map(); let moved = 0, last = null, pinch = null;
svg.addEventListener('pointerdown', e => {
  pts.set(e.pointerId, toSvg(e)); moved = 0;
  if (pts.size === 2){ const [p1,p2] = [...pts.values()]; pinch = {d: Math.hypot(p1[0]-p2[0], p1[1]-p2[1])}; }
  last = toSvg(e);
});
svg.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) { hover(e); return; }
  const cur = toSvg(e); pts.set(e.pointerId, cur);
  if (pts.size === 2 && pinch){
    const [p1,p2] = [...pts.values()]; const d = Math.hypot(p1[0]-p2[0], p1[1]-p2[1]);
    if (pinch.d > 0) zoomAt(d / pinch.d, (p1[0]+p2[0])/2, (p1[1]+p2[1])/2);
    pinch.d = d; moved += 10; return;
  }
  const dx = cur[0]-last[0], dy = cur[1]-last[1]; moved += Math.abs(dx)+Math.abs(dy);
  if (moved > 4){ if (!svg.hasPointerCapture(e.pointerId)) try{ svg.setPointerCapture(e.pointerId); }catch(_){}
    svg.classList.add('dragging'); tip.hidden = true; tx += dx; ty += dy; apply(); }
  last = cur;
});
function endPtr(e){
  const wasTap = pts.size === 1 && moved <= 4;
  pts.delete(e.pointerId); if (pts.size < 2) pinch = null;
  svg.classList.remove('dragging');
  if (wasTap && e.type === 'pointerup'){
    const el = document.elementFromPoint(e.clientX, e.clientY);
    if (el && el.classList && el.classList.contains('prov')) select(el.dataset.id, {scrollPanel:true});
  }
  if (pts.size) last = [...pts.values()][0];
}
svg.addEventListener('pointerup', endPtr);
svg.addEventListener('pointercancel', endPtr);
svg.addEventListener('pointerleave', () => { tip.hidden = true; });
svg.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('prov')){ e.preventDefault(); select(e.target.dataset.id); }
});

function hover(e){
  if (e.pointerType === 'touch') return;
  const el = e.target;
  if (!el.classList || !el.classList.contains('prov')){ tip.hidden = true; return; }
  const d = byId[el.dataset.id];
  tip.innerHTML = `<b>${nm(d.id)}</b><span class="num">${fmt(d.pop)}</span> <span>· ${fp(d.share)}%</span>`;
  tip.hidden = false;
  const card = svg.parentElement.getBoundingClientRect();
  let x = e.clientX - card.left + 14, y = e.clientY - card.top + 14;
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  if (x + tw > card.width - 8) x = e.clientX - card.left - tw - 14;
  if (y + th > card.height - 8) y = e.clientY - card.top - th - 14;
  tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
}

apply();
setLang(lang);
select('32');
</script>
